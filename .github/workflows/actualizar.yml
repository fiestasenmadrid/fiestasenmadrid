name: Actualizar web de fiestas

on:
  schedule:
    - cron: '0 7 * * *'   # cada día a las 09:00 (verano) / 08:00 (invierno) hora de Madrid
  push:
    branches: [main]
  workflow_dispatch:       # botón "Run workflow" para actualizar al momento

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar fiestas desde Google Sheets
        if: ${{ vars.SHEET_TSV_URL != '' }}
        run: curl -fsSL "${{ vars.SHEET_TSV_URL }}" -o fiestas.tsv

      - name: Generar la web
        shell: pwsh
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          RRPP_URL: ${{ secrets.RRPP_URL }}
        run: ./generar.ps1

      # Netlify publica lo que haya en la rama "web" (la web ya generada, sin código)
      - name: Publicar en la rama web (Netlify)
        working-directory: public
        run: |
          git init -q -b web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web generada el $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
